name: Sync Production to Tenant Branches

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can merge

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Tenant Branches
        run: |
          # Define the branches to update automatically
          BRANCHES=("demo" "hallam-city-campus" "jobalign" "steel-audit" "tgl-kandy")
          
          for branch in "${BRANCHES[@]}"; do
            echo "--------------------------------"
            echo "Syncing production to $branch..."
            
            # Try to checkout the branch from remote
            if git show-ref --verify --quiet refs/remotes/origin/$branch; then
              git checkout $branch || git checkout -b $branch origin/$branch
              
              # Merge production into the tenant branch
              git merge origin/production --no-edit
              
              # Push the updated tenant branch back to GitHub
              git push origin $branch
            else
              echo "Branch $branch does not exist on remote. Skipping."
            fi
          done
