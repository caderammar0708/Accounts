name: Deploy JBooks App

on:
  push:
    branches:
      # - demo
      # - ausj
      # - aaafs
      # - aaass
      # - testing
      - jobalign
      # - hallam-city-campus
      # - steel-audit
      - steel-mobile
      # - tgl-kandy
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    
    # THIS IS THE MAGIC LINE:
    # It automatically pulls the secrets from the environment that matches your branch name!
    environment: ${{ github.ref_name }} 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build assets
        run: npm install && npm run build

      - name: Install PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: 'composer'

      - name: Prepare environment file
        shell: bash
        run: |
          cp env/.env.prod.base .env
          
          # Extract prod configuration from targets.json for this branch
          # jq pulls the object, to_entries converts to key/value, and we format it as KEY=VALUE
          jq -r ".\"${{ github.ref_name }}\".prod | to_entries | .[] | \"\(.key)=\(.value)\"" env/targets.json >> .env

      - name: Ensure storage directories exist
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

      - name: Fix storage permissions
        run: |
          sudo chmod -R 777 storage bootstrap/cache || true
          sudo chown -R $(whoami):$(whoami) storage bootstrap/cache || true

      - name: Set permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create storage symlink
        run: |
          ln -s storage/app/public public/storage || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          # Now it just uses the generic secret names loaded from the active environment
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/resources/js/**
            **/node_modules/**
            **/.git/**
            **/.github/**
            **/database/migrations/modules/**
            database/migrations/modules/**
